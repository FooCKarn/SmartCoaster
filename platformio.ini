[platformio]
default_envs = t03_pir

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:node]
build_flags = -DSC_SKETCH_NODE
lib_deps =
  bogde/HX711

[env:gateway]
build_flags = -DSC_SKETCH_GATEWAY
lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  bblanchon/ArduinoJson@^7

[env:t01_blink]
build_flags = -DSC_SKETCH_T01_BLINK

[env:t02_dht11]
build_flags = -DSC_SKETCH_T02_DHT11
lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor

[env:t03_pir]
build_flags = -DSC_SKETCH_T03_PIR

[env:t04_sound]
build_flags = -DSC_SKETCH_T04_SOUND

[env:t05_servo]
build_flags = -DSC_SKETCH_T05_SERVO

[env:t06_ultrasonic]
build_flags = -DSC_SKETCH_T06_ULTRASONIC

[env:t07_hx711_cal]
build_flags = -DSC_SKETCH_T07_HX711_CAL
lib_deps =
  bogde/HX711

[env:t08_hx711_weigh]
build_flags = -DSC_SKETCH_T08_HX711_WEIGH
lib_deps =
  bogde/HX711
