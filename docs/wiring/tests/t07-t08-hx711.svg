<text x="56" y="1044" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ต่อสาย</text>
<text x="56" y="1065" font-size="13" text-anchor="start" font-weight="400" fill="#333">   1) HX711 DT → D19 (GPIO19)</text>
<text x="56" y="1086" font-size="13" text-anchor="start" font-weight="400" fill="#333">   2) HX711 SCK → D18 (GPIO18)</text>
<text x="56" y="1107" font-size="13" text-anchor="start" font-weight="400" fill="#333">   3) HX711 VCC → 3V3 (ถ้ามีขา VDD แยก ต่อ 3V3 ด้วย)</text>
<text x="56" y="1128" font-size="13" text-anchor="start" font-weight="400" fill="#333">   4) HX711 GND → GND</text>
<text x="56" y="1149" font-size="13" text-anchor="start" font-weight="400" fill="#333">   5) Load cell แดง/ดำ/ขาว/เขียว → E+ / E− / A− / A+ ของ HX711</text>
<text x="56" y="1170" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ผลที่ควรเห็นใน Serial Monitor (115200)</text>
<text x="56" y="1191" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • t07: ยกของออก → รอ tare → วางของรู้น้ำหนัก พิมพ์กรัมแล้ว Enter → raw = ...  -&gt;  CAL_FACTOR = ...  (ทำ 3 รอบ เฉลี่ย จดลง docs/calibration.md)</text>
<text x="56" y="1212" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • t08: ใส่ CAL_FACTOR ในโค้ด → weight =   250.0 g · ส่ง &#x27;t&#x27; เพื่อ tare ใหม่</text>
<text x="56" y="1233" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ข้อควรระวัง</text>
<text x="56" y="1254" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • HX711 not ready - เช็คสาย = DT/SCK/VCC ผิด · น้ำหนักติดลบ = สลับ A+ กับ A− · ยึด load cell ให้ปลายหนึ่งลอย (ตามลูกศรบนตัว)</text></svg>