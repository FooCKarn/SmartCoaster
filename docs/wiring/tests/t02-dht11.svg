<text x="56" y="1128" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ผลที่ควรเห็นใน Serial Monitor (115200)</text>
<text x="56" y="1149" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • DHT11 test แล้วตามด้วย  T = 27.0 C  RH = 60 %  ทุก 2 วินาที</text>
<text x="56" y="1170" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ลองเป่าลมหายใจใส่ → RH ต้องขึ้น</text>
<text x="56" y="1191" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ข้อควรระวัง</text>
<text x="56" y="1212" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ขึ้น DHT read FAILED ตลอด: เช็กสาย S และ + (ต้องเป็น 3V3) · ต้องติดตั้งไลบรารี DHT sensor library (Adafruit)</text></svg>