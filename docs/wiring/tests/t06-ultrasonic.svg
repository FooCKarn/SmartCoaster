<text x="355.0" y="680.0" font-size="12" text-anchor="middle" font-weight="700" fill="#b00020">Echo ออก 5 V → ต้องแบ่งแรงดันก่อนเข้า ESP32</text>
<rect x="40" y="994" width="1620" height="250" rx="8" fill="#fff8e6" stroke="#d9a400" stroke-width="1.5"/>
<text x="56" y="1020" font-size="15" text-anchor="start" font-weight="700" fill="#5c4400">เช็กลิสต์ทดสอบ</text>
<text x="56" y="1044" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ต่อสาย</text>
<text x="56" y="1065" font-size="13" text-anchor="start" font-weight="400" fill="#333">   1) HC-SR04 Trig → D25 (GPIO25)</text>
<text x="56" y="1086" font-size="13" text-anchor="start" font-weight="400" fill="#333">   2) HC-SR04 Echo → ตัวต้านทาน 1kΩ → D26 (GPIO26)  และจากจุด D26 ต่อ 2kΩ ลง GND</text>
<text x="56" y="1107" font-size="13" text-anchor="start" font-weight="400" fill="#333">   3) HC-SR04 VCC → VIN (5 V)</text>
<text x="56" y="1128" font-size="13" text-anchor="start" font-weight="400" fill="#333">   4) HC-SR04 GND → GND</text>
<text x="56" y="1149" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ผลที่ควรเห็นใน Serial Monitor (115200)</text>
<text x="56" y="1170" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • dist = 35.2 cm ทุกครั้งที่อ่าน · เอามือเข้าใกล้/ออกห่าง ค่าต้องเปลี่ยนตาม</text>
<text x="56" y="1191" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • no echo (timeout) = ไม่มีวัตถุในระยะ หรือสาย Echo/Trig ผิด</text>
<text x="56" y="1212" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ข้อควรระวัง</text>
<text x="56" y="1233" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ถ้าไม่มี 2kΩ ใช้ 1kΩ 2 ตัวต่ออนุกรมแทนได้ · ถ้าเป็นรุ่น HC-SR04P (3.3 V) ต่อ VCC → 3V3 และ Echo ตรงเข้า GPIO26 ได้เลย</text></svg>