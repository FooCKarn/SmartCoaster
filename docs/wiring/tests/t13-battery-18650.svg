<circle cx="660" cy="818" r="5" fill="#222222"/>
<polyline points="230,611 535,611 535,818 738,818" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="994" width="1620" height="418" rx="8" fill="#fff8e6" stroke="#d9a400" stroke-width="1.5"/>
<text x="56" y="1020" font-size="15" text-anchor="start" font-weight="700" fill="#5c4400">เช็กลิสต์ทดสอบ</text>
<text x="56" y="1044" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ต่อสาย</text>
<text x="56" y="1065" font-size="13" text-anchor="start" font-weight="400" fill="#333">   1) แบต 18650 ขั้ว + → ตัวต้านทาน 100kΩ ตัวบน → จุดกลาง</text>
<text x="56" y="1086" font-size="13" text-anchor="start" font-weight="400" fill="#333">   2) จุดกลาง → D34 (GPIO34)</text>
<text x="56" y="1107" font-size="13" text-anchor="start" font-weight="400" fill="#333">   3) จุดกลาง → ตัวต้านทาน 100kΩ ตัวล่าง → GND</text>
<text x="56" y="1128" font-size="13" text-anchor="start" font-weight="400" fill="#333">   4) แบต 18650 ขั้ว − → GND ของ ESP32</text>
<text x="56" y="1149" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ผลที่ควรเห็นใน Serial Monitor (115200)</text>
<text x="56" y="1170" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • t13 18650 single cell (GPIO34) แล้วตามด้วยบรรทัดแบบนี้ทุก 1 วินาที</text>
<text x="56" y="1191" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • pin = 1910 mV  VBAT = 3.820 V  ~60 %  [ok]</text>
<text x="56" y="1212" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ทุก 10 วินาทีมีสรุป: --- 10 s: min / max / avg และ แกว่ง (นิ่งดี = ต่ำกว่า 30 mV)</text>
<text x="56" y="1233" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • วัดแบตด้วยมัลติมิเตอร์ แล้วส่ง g&lt;ค่าที่วัดได้&gt; เช่น g3.852 → โค้ดตั้ง VBAT_GAIN ให้ (ต่างไม่เกิน 0.05 V ก็ผ่าน)</text>
<text x="56" y="1254" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ค่า VBAT_GAIN ที่ได้ ให้ใส่ใน t10 / t14 ด้วย · ส่ง r = ล้างสถิติ 10 วินาที</text>
<text x="56" y="1275" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ข้อควรระวัง</text>
<text x="56" y="1296" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ใส่แบตกลับขั้ว: ตัวแบ่งไม่พังทันที แต่ ESP32 เห็นแรงดันติดลบ (VBAT ≈ 0) ให้เช็คขั้วด้วยมัลติมิเตอร์ก่อนต่อ</text>
<text x="56" y="1317" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • เทสนี้ ESP32 ใช้ไฟ USB อย่างเดียว ห้ามต่อแบตเข้าขา 3V3 หรือ VIN โดยตรง</text>
<text x="56" y="1338" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • แบตเต็มต้องเห็น ≈ 4.20 V · ถ้าต่ำกว่า 3.0 V ห้ามใช้ต่อ ให้ชาร์จก่อน · ต่ำกว่า 2.8 V = ทิ้งหรือเปลี่ยนก้อน</text>
<text x="56" y="1359" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • VBAT อ่านได้ 0 = สายแบต + หรือตัวต้านทานตัวบนหลุด · สูงเกิน 4.25 V = ตัวต้านทานผิดค่า (ต้อง 100k ทั้งสองตัว)</text>
<text x="56" y="1380" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ตัวแบ่งกินกระแสต่อเนื่อง ≈ 21 µA (4.2 V ÷ 200 kΩ) ถ้าเก็บแบตไว้นาน ให้ถอดสายตัวแบ่งออก</text>
<text x="56" y="1401" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ไม่มี C กรองไฟ ค่าอาจแกว่งเล็กน้อย (โค้ดเฉลี่ย 16 ครั้งให้แล้ว)</text></svg>