<text x="56" y="1044" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ต่อสาย</text>
<text x="56" y="1065" font-size="13" text-anchor="start" font-weight="400" fill="#333">   1) ไม่มี เสียบ USB อย่างเดียว</text>
<text x="56" y="1086" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ผลที่ควรเห็นใน Serial Monitor (115200)</text>
<text x="56" y="1107" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • Board OK. STA MAC = XX:XX:XX:XX:XX:XX  แล้วตามด้วย blink ทุกวินาที</text>
<text x="56" y="1128" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • จด MAC ของบอร์ด gateway ลง docs/calibration.md (node ต้องใช้ส่ง ESP-NOW)</text>
<text x="56" y="1149" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ข้อควรระวัง</text>
<text x="56" y="1170" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • อัปโหลดไม่ขึ้น: ลองกดปุ่ม BOOT ค้างตอนขึ้น Connecting... / เปลี่ยนสาย USB ที่ส่งข้อมูลได้</text></svg>