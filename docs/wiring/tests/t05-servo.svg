<rect x="40" y="994" width="1620" height="292" rx="8" fill="#fff8e6" stroke="#d9a400" stroke-width="1.5"/>
<text x="56" y="1020" font-size="15" text-anchor="start" font-weight="700" fill="#5c4400">เช็กลิสต์ทดสอบ</text>
<text x="56" y="1044" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ต่อสาย</text>
<text x="56" y="1065" font-size="13" text-anchor="start" font-weight="400" fill="#333">   1) Servo ส้ม → D18 (GPIO18)</text>
<text x="56" y="1086" font-size="13" text-anchor="start" font-weight="400" fill="#333">   2) Servo แดง → VIN (5 V)</text>
<text x="56" y="1107" font-size="13" text-anchor="start" font-weight="400" fill="#333">   3) Servo น้ำตาล → GND</text>
<text x="56" y="1128" font-size="13" text-anchor="start" font-weight="400" fill="#333">   4) C 470–1000µF คร่อม 5V–GND ใกล้เซอร์โว (ขั้ว + ไป 5V)</text>
<text x="56" y="1149" font-size="13" text-anchor="start" font-weight="400" fill="#333">   5) ปุ่ม: ขาหนึ่ง → D33, อีกขา → GND (ไม่ต้องมีตัวต้านทาน ใช้ pull-up ภายใน)</text>
<text x="56" y="1170" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ผลที่ควรเห็นใน Serial Monitor (115200)</text>
<text x="56" y="1191" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • -&gt; 90 deg (ยกป้าย) / -&gt; 0 deg (ลดป้าย) สลับทุก 2 วินาที</text>
<text x="56" y="1212" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • กดปุ่ม → E-STOP pressed. Servo released. (กด EN เพื่อเริ่มใหม่)</text>
<text x="56" y="1233" font-size="13" text-anchor="start" font-weight="400" fill="#333">▸ ข้อควรระวัง</text>
<text x="56" y="1254" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • ถ้าบอร์ดรีเซ็ตตอนเซอร์โวหมุน = ไฟ USB ไม่พอ: ใช้พอร์ต/อะแดปเตอร์ ≥1 A หรือแยกไฟ 5 V ให้เซอร์โว (GND ร่วม)</text>
<text x="56" y="1275" font-size="13" text-anchor="start" font-weight="400" fill="#333">   • sketch ใช้ ESP32 Arduino core 3.x (ledcAttach) — ถ้า compile error ให้อัปเดต board package</text></svg>